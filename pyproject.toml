[project]
name = "agent-gateway"
version = "0.1.0"
description = "MCP gateway: auth, RBAC, rate limiting, audit, tracing, and human approval in front of many MCP servers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sorting, B bugbear, UP pyupgrade
select = ["E", "F", "I", "B", "UP"]
